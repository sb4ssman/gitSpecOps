[project]
name = "git-spec-ops"
version = "0.2.0"
description = "Cautious tools for multi-repository Git and GitHub operations"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "sb4ssman" }]
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
keywords = ["git", "github", "repository", "archive", "migration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]

# No runtime dependencies below App/: every operation is stdlib-only and run as a script.
dependencies = []

# `gitso` as a command in any terminal, for setup's "Install the gitso command": `uv tool install
# --editable <this folder>` builds a separate tool environment (never this folder's .venv) whose
# `gitso` launcher runs the code in this checkout. Remove with `uv tool uninstall git-spec-ops`.
[project.scripts]
gitso = "gitso:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["gitso"]

[tool.setuptools.packages.find]
include = ["Basic*", "Special*", "Elaborate*", "App*", "_os*"]
namespaces = true

# Build bookkeeping goes in _build/, never the repository root.
[tool.distutils.egg_info]
egg_base = "_build"

[project.optional-dependencies]
# The App's tray and window (Qt). Nothing below App/ may import it; the web view needs none.
# Install with: uv sync --extra app
app = ["PySide6-Essentials>=6.12"]

# This project is NOT an importable package. The tools are flat scripts that put their own
# directory (and the repo root, for the layers) on sys.path at runtime. `.venv` exists only to
# give the launchers a clean, predictable interpreter. Do NOT install the project into it:
# an editable install drops a `.pth` that runs finder code on every interpreter startup, which
# turns a stray SIGINT during startup into `Fatal Python error: init_import_site`.
[tool.uv]
package = false
