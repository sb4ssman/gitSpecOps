[project]
name = "git-spec-ops"
version = "0.2.0"
description = "Cautious tools for multi-repository Git and GitHub operations"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "sb4ssman" }]
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
keywords = ["git", "github", "repository", "archive", "migration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]

# No runtime dependencies below App/: every operation is stdlib-only and run as a script.
dependencies = []

# `gitso` on the command path is setup's job (_build/gitso_command.py): plain-text launchers that
# run gitso.py, the same on every system. Nothing here builds or installs a package.

[project.optional-dependencies]
# The App's tray and window (Qt). Nothing below App/ may import it; the web view needs none.
# Install with: uv sync --extra app
# Each macOS gets the newest Qt built for it (Qt's Mac builds: 6.12 needs macOS 14, 6.11 macOS 13,
# 6.9 macOS 12, 6.7 macOS 11). platform_release is the Darwin version: macOS 14 is Darwin 23.
app = [
    "PySide6-Essentials>=6.12; sys_platform != 'darwin' or platform_release >= '23'",
    "PySide6-Essentials>=6.11,<6.12; sys_platform == 'darwin' and platform_release >= '22' and platform_release < '23'",
    "PySide6-Essentials>=6.9,<6.10; sys_platform == 'darwin' and platform_release >= '21' and platform_release < '22'",
    "PySide6-Essentials>=6.7,<6.8; sys_platform == 'darwin' and platform_release >= '20' and platform_release < '21'",
]
# Sealing the shared protected values for a synced folder (Elaborate/_fleet/sealed.py). Optional:
# setup or the App & setup tab installs it. Install with: uv sync --extra app --extra crypto
crypto = ["cryptography>=43"]

# This project is NOT an importable package. The tools are flat scripts that put their own
# directory (and the repo root, for the layers) on sys.path at runtime. `.venv` exists only to
# give the launchers a clean, predictable interpreter. Do NOT install the project into it:
# an editable install drops a `.pth` that runs finder code on every interpreter startup, which
# turns a stray SIGINT during startup into `Fatal Python error: init_import_site`.
[tool.uv]
package = false

# A development check only (CI runs it; nothing at run time needs it): uvx ruff@0.17.3 check .
# Only the rules that find real mistakes: undefined names, unused imports and variables,
# redefinitions, syntax errors, and closures that capture a loop variable. Import order and style
# are left alone: the scripts put their folder on sys.path before importing (E402) on purpose.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B023"]
